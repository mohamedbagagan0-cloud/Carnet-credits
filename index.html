<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de Crédits</title>
<meta name="theme-color" content="#1B7A4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#12202B; --muted:#5C6B75; --line:#D5DDD8;
  --debt:#B8321F; --ok:#1B7A4B; --btn:#12202B; --btn-ink:#FFFFFF; --hl:#F4D35E; --overlay:rgba(18,32,43,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A17; --surface:#172622; --ink:#ECF2EE; --muted:#93A59D; --line:#263832;
    --debt:#FF8A73; --ok:#5BD498; --btn:#ECF2EE; --btn-ink:#0F1A17; --hl:#F4D35E; --overlay:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#172622; --ink:#ECF2EE; --muted:#93A59D; --line:#263832;
  --debt:#FF8A73; --ok:#5BD498; --btn:#ECF2EE; --btn-ink:#0F1A17; --hl:#F4D35E; --overlay:rgba(0,0,0,.65);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:560px; margin:0 auto; padding:0 16px 120px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--hl); outline-offset:2px}
[hidden]{display:none !important}

.top{padding:22px 0 8px}
.top-row{display:flex; justify-content:space-between; align-items:center}
.brand{font-weight:800; font-size:20px; letter-spacing:-.01em}
.icon-btn{background:none; border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--muted)}
.total{margin-top:22px}
.total .lbl{color:var(--muted); font-size:15px}
.total .amt{
  display:block; font-size:clamp(34px,10vw,48px); font-weight:800; letter-spacing:-.02em; line-height:1.1;
  padding-bottom:8px; border-bottom:4px double var(--ink); margin-top:2px;
}
.total .sub{margin-top:8px; color:var(--muted); font-size:15px}

.tools{margin:18px 0 6px; display:grid; gap:10px}
.search{width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font:inherit}
.chips{display:flex; gap:8px}
.chip{border:1px solid var(--line); background:transparent; border-radius:999px; padding:7px 14px; color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--btn); color:var(--btn-ink); border-color:var(--btn)}

.list{margin:8px 0 0; padding:0; list-style:none; background:var(--surface); border:1px solid var(--line); border-radius:14px}
.row{
  display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--line); padding:14px 16px;
}
.list li:last-child .row{border-bottom:0}
.row .nm{font-weight:600; display:block}
.row .meta{color:var(--muted); font-size:14px; display:block}
.bal{font-weight:800; white-space:nowrap; text-align:right}
.bal.debt{color:var(--debt)}
.bal.ok{color:var(--ok)}
.empty{padding:28px 18px; text-align:center; color:var(--muted)}

.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
}
.bar-inner{max-width:560px; margin:0 auto; display:flex; gap:10px}
.btn{
  flex:1; border:0; border-radius:12px; padding:15px 16px; font-weight:600; font-size:16px;
  background:var(--btn); color:var(--btn-ink);
}
.btn.alt{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.debt{background:var(--debt); color:#fff}
.btn.ok{background:var(--ok); color:#fff}
.btn.danger{background:transparent; color:var(--debt); border:1px solid var(--debt)}
.link-btn{display:inline-block; text-align:center; text-decoration:none}

.back{background:none; border:0; padding:18px 0 6px; color:var(--muted); font-size:16px}
.who h1{margin:6px 0 0; font-size:28px; font-weight:800; letter-spacing:-.01em; line-height:1.15}
.who .ph{color:var(--muted)}
.who .amt{display:block; margin-top:14px; font-size:clamp(30px,9vw,42px); font-weight:800; border-bottom:4px double var(--ink); padding-bottom:8px}
.who .amt.debt{color:var(--debt)} .who .amt.ok{color:var(--ok)}
.who .cap{color:var(--muted); font-size:15px; margin-top:6px}
.acts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0}
.acts .full{grid-column:1/-1}
h2{font-size:17px; margin:22px 0 8px}
.tx{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:12px 16px; border-bottom:1px solid var(--line)}
.list li:last-child .tx{border-bottom:0}
.tx .d{color:var(--muted); font-size:14px}
.tx .n{font-weight:600}
.tx .a{font-weight:800; white-space:nowrap; text-align:right}
.tx .a.debt{color:var(--debt)} .tx .a.ok{color:var(--ok)}
.tx .x{background:none; border:0; color:var(--muted); font-size:13px; padding:2px 0; text-decoration:underline}

.overlay{position:fixed; inset:0; background:var(--overlay); z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet{
  width:100%; max-width:560px; max-height:92%; overflow:auto; background:var(--surface);
  border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
}
.sheet h3{margin:0 0 14px; font-size:20px}
.sheet label{display:block; font-weight:600; margin:12px 0 5px}
.sheet input,.sheet textarea{
  width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:12px;
  background:var(--bg); color:var(--ink); font:inherit;
}
.sheet textarea{min-height:110px; font-size:13px}
.sheet .btns{display:flex; gap:10px; margin-top:18px}
.err{color:var(--debt); margin-top:10px; min-height:1.2em}
.note{color:var(--muted); font-size:14px; margin:8px 0 0}
.mini{background:none; border:0; color:var(--ink); text-decoration:underline; padding:4px 0; font-size:14px}
.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--btn); color:var(--btn-ink); padding:10px 16px; border-radius:999px; z-index:30}
.warn{background:var(--hl); color:#12202B; padding:10px 14px; border-radius:12px; margin-top:12px; font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<main>
  <section id="listView">
    <header class="top">
      <div class="top-row">
        <div class="brand" id="brand">Carnet de crédits</div>
        <button class="icon-btn" onclick="openSettings()">Réglages</button>
      </div>
      <div class="total">
        <span class="lbl">Total à recevoir</span>
        <span class="amt" id="total">0 FCFA</span>
        <div class="sub" id="count"></div>
      </div>
      <div class="warn" id="warn" hidden>Impossible d'enregistrer sur ce téléphone. Utilisez « Réglages » pour copier une sauvegarde.</div>
    </header>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Chercher un client" aria-label="Chercher un client" autocomplete="off">
      <div class="chips" role="group" aria-label="Filtrer">
        <button class="chip" data-f="all" aria-pressed="true">Tous</button>
        <button class="chip" data-f="debt" aria-pressed="false">Ils doivent</button>
        <button class="chip" data-f="ok" aria-pressed="false">Soldés</button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
    <div class="bar"><div class="bar-inner"><button class="btn" onclick="openAddClient()">Nouveau client</button></div></div>
  </section>

  <section id="detailView" hidden>
    <button class="back" onclick="go('list')">‹ Retour aux clients</button>
    <div class="who" id="who"></div>
    <div class="acts" id="acts"></div>
    <h2>Historique</h2>
    <ul class="list" id="hist"></ul>
  </section>
</main>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
var KEY = 'carnet_credits_v1';
var db = { shop: '', clients: [] };
var view = { name: 'list', id: null };
var filter = 'all', query = '';

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ return new Intl.NumberFormat('fr-FR').format(Math.abs(n)) + ' FCFA'; }
function today(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fdate(iso){
  try { return new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch(e){ return iso; }
}
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function load(){
  try {
    var r = localStorage.getItem(KEY);
    if (r) { var d = JSON.parse(r); if (d && Array.isArray(d.clients)) db = { shop: d.shop || '', clients: d.clients }; }
  } catch(e) { $('#warn').hidden = false; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e) { $('#warn').hidden = false; }
}
function bal(c){
  return c.tx.reduce(function(s,t){ return s + (t.type === 'credit' ? t.amount : -t.amount); }, 0);
}
function lastDate(c){
  return c.tx.reduce(function(m,t){ return t.date > m ? t.date : m; }, '');
}
function find(id){ return db.clients.filter(function(c){ return c.id === id; })[0]; }
function toast(msg){
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}

function go(name, id){
  view = { name: name, id: id || null };
  render(); window.scrollTo(0, 0);
}

function render(){
  $('#brand').textContent = db.shop ? db.shop : 'Carnet de crédits';
  if (view.name === 'list') { $('#listView').hidden = false; $('#detailView').hidden = true; renderList(); }
  else { $('#listView').hidden = true; $('#detailView').hidden = false; renderDetail(); }
}

function renderList(){
  var all = db.clients.map(function(c){ return { c: c, b: bal(c) }; });
  var owing = all.filter(function(x){ return x.b > 0; });
  var total = owing.reduce(function(s,x){ return s + x.b; }, 0);
  $('#total').textContent = fmt(total);
  $('#count').textContent = owing.length
    ? owing.length + (owing.length > 1 ? ' clients ont' : ' client a') + ' un solde à payer'
    : (all.length ? 'Personne ne vous doit d\'argent' : 'Aucun client pour le moment');

  var nq = norm(query);
  var items = all.filter(function(x){
    if (nq && norm(x.c.name + ' ' + (x.c.phone || '')).indexOf(nq) === -1) return false;
    if (filter === 'debt') return x.b > 0;
    if (filter === 'ok') return x.b <= 0;
    return true;
  }).sort(function(a,b){ return (b.b - a.b) || a.c.name.localeCompare(b.c.name, 'fr'); });

  var ul = $('#list');
  if (!items.length) {
    ul.innerHTML = '<li class="empty">' + (all.length
      ? 'Aucun client ne correspond.'
      : 'Ajoutez votre premier client pour noter ce qu\'il vous doit.') + '</li>';
    return;
  }
  ul.innerHTML = items.map(function(x){
    var ld = lastDate(x.c);
    var cls = x.b > 0 ? 'debt' : 'ok';
    var txt = x.b > 0 ? fmt(x.b) : (x.b < 0 ? 'Avance ' + fmt(x.b) : 'Soldé');
    return '<li><button class="row" onclick="go(\'detail\',' + x.c.id + ')">' +
      '<span><span class="nm">' + esc(x.c.name) + '</span><span class="meta">' +
      (ld ? 'Dernier mouvement : ' + fdate(ld) : 'Aucun mouvement') + '</span></span>' +
      '<span class="bal ' + cls + '">' + txt + '</span></button></li>';
  }).join('');
}

function waLink(c, b){
  var p = String(c.phone || '').replace(/\D/g, '');
  if (!p) return '';
  if (p.indexOf('00') === 0) p = p.slice(2);
  else if (p.length === 10) p = '225' + p;
  var shop = db.shop ? db.shop : 'la boutique';
  var msg = 'Bonjour ' + c.name + ', petit rappel de ' + shop + ' : votre solde est de ' + fmt(b) + '. Merci de passer le régler dès que possible.';
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(msg);
}

function renderDetail(){
  var c = find(view.id);
  if (!c) { go('list'); return; }
  var b = bal(c);
  var cls = b > 0 ? 'debt' : 'ok';
  var cap = b > 0 ? 'Ce client vous doit' : (b < 0 ? 'Vous lui devez (avance)' : 'Compte soldé');
  $('#who').innerHTML = '<h1>' + esc(c.name) + '</h1>' +
    (c.phone ? '<div class="ph">' + esc(c.phone) + '</div>' : '') +
    '<span class="amt ' + cls + '">' + (b === 0 ? '0 FCFA' : fmt(b)) + '</span><div class="cap">' + cap + '</div>';

  var wa = b > 0 ? waLink(c, b) : '';
  $('#acts').innerHTML =
    '<button class="btn debt" onclick="openTx(\'credit\')">Ajouter un crédit</button>' +
    '<button class="btn ok" onclick="openTx(\'paiement\')">Paiement reçu</button>' +
    (wa ? '<a class="btn alt link-btn full" href="' + wa + '" target="_blank" rel="noopener">Envoyer un rappel sur WhatsApp</a>' : '') +
    '<button class="btn alt full" onclick="openEditClient()">Modifier le client</button>';

  var txs = c.tx.slice().sort(function(a,b2){ return (b2.date.localeCompare(a.date)) || (b2.id - a.id); });
  $('#hist').innerHTML = txs.length ? txs.map(function(t){
    var isC = t.type === 'credit';
    return '<li><div class="tx"><div><div class="n">' + (isC ? 'Crédit' : 'Paiement') + (t.note ? ' · ' + esc(t.note) : '') + '</div>' +
      '<div class="d">' + fdate(t.date) + '</div>' +
      '<button class="x" onclick="askDeleteTx(' + t.id + ')">Supprimer</button></div>' +
      '<div class="a ' + (isC ? 'debt' : 'ok') + '">' + (isC ? '+ ' : '− ') + fmt(t.amount) + '</div></div></li>';
  }).join('') : '<li class="empty">Aucun mouvement. Ajoutez un crédit ou un paiement.</li>';
}

/* ---------- Fenêtres ---------- */
function sheet(html){
  $('#sheet').innerHTML = html; $('#overlay').hidden = false;
  var f = $('#sheet input'); if (f) setTimeout(function(){ f.focus(); }, 60);
}
function closeSheet(){ $('#overlay').hidden = true; $('#sheet').innerHTML = ''; }
$('#overlay').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

function openAddClient(){
  sheet('<h3>Nouveau client</h3>' +
    '<label for="fn">Nom</label><input id="fn" type="text" autocomplete="off" placeholder="Ex : Awa Koné">' +
    '<label for="fp">Téléphone (facultatif)</label><input id="fp" type="tel" inputmode="tel" placeholder="Ex : 07 00 00 00 00">' +
    '<div class="err" id="err"></div>' +
    '<div class="btns"><button class="btn alt" onclick="closeSheet()">Annuler</button><button class="btn" onclick="addClient()">Ajouter</button></div>');
}
function addClient(){
  var name = $('#fn').value.trim();
  if (!name) { $('#err').textContent = 'Écrivez le nom du client.'; return; }
  var c = { id: Date.now(), name: name, phone: $('#fp').value.trim(), tx: [] };
  db.clients.push(c); save(); closeSheet(); go('detail', c.id);
}
function openEditClient(){
  var c = find(view.id);
  sheet('<h3>Modifier le client</h3>' +
    '<label for="fn">Nom</label><input id="fn" type="text" value="' + esc(c.name) + '">' +
    '<label for="fp">Téléphone</label><input id="fp" type="tel" inputmode="tel" value="' + esc(c.phone || '') + '">' +
    '<div class="err" id="err"></div>' +
    '<div class="btns"><button class="btn alt" onclick="closeSheet()">Annuler</button><button class="btn" onclick="saveClient()">Enregistrer</button></div>' +
    '<div class="btns"><button class="btn danger" onclick="askDeleteClient()">Supprimer ce client</button></div>');
}
function saveClient(){
  var c = find(view.id), name = $('#fn').value.trim();
  if (!name) { $('#err').textContent = 'Écrivez le nom du client.'; return; }
  c.name = name; c.phone = $('#fp').value.trim(); save(); closeSheet(); render();
}
function openTx(type){
  var c = find(view.id), b = bal(c), isC = type === 'credit';
  sheet('<h3>' + (isC ? 'Nouveau crédit' : 'Paiement reçu') + ' · ' + esc(c.name) + '</h3>' +
    '<label for="fa">Montant (FCFA)</label><input id="fa" type="text" inputmode="numeric" placeholder="Ex : 5000" autocomplete="off">' +
    (!isC && b > 0 ? '<button class="mini" onclick="document.getElementById(\'fa\').value=' + b + '">Tout payer (' + fmt(b) + ')</button>' : '') +
    '<label for="fnote">Note (facultatif)</label><input id="fnote" type="text" placeholder="' + (isC ? 'Ex : 2 sacs de riz' : 'Ex : Orange Money') + '">' +
    '<label for="fd">Date</label><input id="fd" type="date" value="' + today() + '">' +
    '<div class="err" id="err"></div>' +
    '<div class="btns"><button class="btn alt" onclick="closeSheet()">Annuler</button>' +
    '<button class="btn ' + (isC ? 'debt' : 'ok') + '" onclick="addTx(\'' + type + '\')">Enregistrer</button></div>');
}
function addTx(type){
  var c = find(view.id);
  var amount = parseInt(String($('#fa').value).replace(/\D/g, ''), 10);
  if (!amount || amount <= 0) { $('#err').textContent = 'Entrez un montant supérieur à 0.'; return; }
  c.tx.push({ id: Date.now(), type: type, amount: amount, note: $('#fnote').value.trim(), date: $('#fd').value || today() });
  save(); closeSheet(); render(); toast(type === 'credit' ? 'Crédit enregistré' : 'Paiement enregistré');
}
function confirmSheet(msg, label, fn){
  sheet('<h3>' + esc(msg) + '</h3><div class="btns"><button class="btn alt" onclick="closeSheet()">Annuler</button><button class="btn danger" id="yes">' + esc(label) + '</button></div>');
  $('#yes').onclick = function(){ closeSheet(); fn(); };
}
function askDeleteTx(id){
  confirmSheet('Supprimer ce mouvement ?', 'Supprimer', function(){
    var c = find(view.id); c.tx = c.tx.filter(function(t){ return t.id !== id; }); save(); render();
  });
}
function askDeleteClient(){
  var c = find(view.id);
  confirmSheet('Supprimer ' + c.name + ' et tout son historique ?', 'Supprimer', function(){
    db.clients = db.clients.filter(function(x){ return x.id !== c.id; }); save(); go('list');
  });
}
function openSettings(){
  sheet('<h3>Réglages et sauvegarde</h3>' +
    '<label for="shop">Nom de votre boutique</label><input id="shop" type="text" value="' + esc(db.shop) + '" placeholder="Ex : Boutique Mohamed">' +
    '<p class="note">Il apparaît en haut et dans les rappels WhatsApp.</p>' +
    '<label for="bk">Sauvegarde</label><textarea id="bk" readonly></textarea>' +
    '<p class="note">Vos données restent sur ce téléphone. Copiez cette sauvegarde et envoyez-la-vous sur WhatsApp de temps en temps.</p>' +
    '<div class="btns"><button class="btn alt" onclick="copyBackup()">Copier la sauvegarde</button></div>' +
    '<label for="rs">Restaurer une sauvegarde</label><textarea id="rs" placeholder="Collez ici la sauvegarde"></textarea>' +
    '<div class="err" id="err"></div>' +
    '<div class="btns"><button class="btn alt" onclick="closeSheet()">Fermer</button><button class="btn" onclick="saveSettings()">Enregistrer</button></div>');
  $('#bk').value = JSON.stringify(db);
}
function copyBackup(){
  var ta = $('#bk');
  ta.removeAttribute('readonly'); ta.focus(); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  ta.setAttribute('readonly', '');
  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value).then(function(){ toast('Sauvegarde copiée'); }, function(){}); return; }
  toast(ok ? 'Sauvegarde copiée' : 'Sélectionnez le texte et copiez-le');
}
function saveSettings(){
  var rs = $('#rs').value.trim();
  if (rs) {
    try {
      var d = JSON.parse(rs);
      if (!d || !Array.isArray(d.clients)) throw new Error('bad');
      db = { shop: d.shop || '', clients: d.clients };
    } catch(e) { $('#err').textContent = 'Cette sauvegarde n\'est pas valide.'; return; }
  } else {
    db.shop = $('#shop').value.trim();
  }
  save(); closeSheet(); go('list'); toast('Enregistré');
}

$('#q').addEventListener('input', function(){ query = this.value; renderList(); });
document.querySelectorAll('.chip').forEach(function(b){
  b.addEventListener('click', function(){
    filter = b.getAttribute('data-f');
    document.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    renderList();
  });
});

load(); render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
